<!DOCTYPE html>

		<style>
			:root {
				--bg: #121212;
				--fg: #e0e0e0;
				--border: #333;
				--accent: #444;
				
				--text: #dcdcdc;
				--selection-bg: #007aff59;
				--nav-bg: #252525;
				--content-bg: #1e1e1e;
				
				--bg1: #2d2d2d;
				--bg2: #252525;
				--bg3: #1e1e1e;
				--text1: #FAFAFA;
				--text2: #dcdcdc;
				
				--sidebar-width: 20dvw;
				
				--sidebar-bg: #252525;
				--scrollbar-thumb: #444;
				--scrollbar-track: transparent;
				
				--input-bg: #3c3c3c;
				--border: #333;
				--text: #dcdcdc;
				--base-fs: 16px;
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-size: inherit;
				user-select: none;
			}
			body {
				display: flex;
				flex-direction: column;
				height: 100dvh;
				overflow: hidden;
			}
			header,
			footer {
				display: flex;
				align-items: center;
				place-content: start;
				background: var(--bg1);
			}
			header > *,
			footer > * {
				flex: 1 1 0; /* Distributes total width equally among all buttons */
				min-width: 0; /* Prevents overflow on narrow mobile screens */
				height: 48px; /* 48px meets mobile touch target accessibility standards */
				color: var(--text);
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				background: transparent;
				border: none;
				transition: color 0.2s;
			}
			header button:hover:not(:disabled),
			footer button:hover:not(:disabled) {
				background: var(--accent);
			}
			header button:disabled,
			footer button:disabled {
				opacity: .2;
				cursor: default;
			}
			header button > svg,
			footer button > svg {
				width: 1.5rem;
				height: 1.5rem;
				fill: none;
				stroke: currentColor;
				stroke-width: 2;
			}
			main {
				flex: 1;
				min-height: 0;
				overflow: auto;
				display: grid;
				justify-items: center;
			}
			#calendar {
				display: grid;
				grid-template-columns: repeat(8, 1fr);
				width: 80%;
				container-type: inline-size;
			}
			#calendar span {
				aspect-ratio: 1;
				display: grid;
				place-items: center;
				font-size: max(1rem, 2cqw);
			}
			#calendar span:nth-child(-n+8) {
				position: sticky;
				top: 0;
				z-index: 9;
				background: var(--bg-color, #ffffff); /* Must be solid to cover scrolling dates */
				border-bottom: 1px solid var(--border-color, #e5e5e5);
				font-weight: bold;
			}

		<script>
			let date = new Date();
			const actions = new WeakMap(), menu = {}, view = {}, getWeekNumber = d => {
				const target = new Date(d.valueOf());
				const dayNr = (d.getDay() + 6) % 7;
				target.setDate(target.getDate() - dayNr + 3);
				const firstThursday = target.valueOf();
				target.setMonth(0, 1);
				if (target.getDay() !== 4) {
					target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
				}
				return 1 + Math.round((firstThursday - target) / 604800000);
			}, renderCalendar = (date = new Date()) => {
				const container = document.getElementById('calendar'),
				year = date.getFullYear(),
				month = date.getMonth();
				let html = `
					<span>الأسبوع</span>
					<span>الأحد</span>
					<span>الإثنين</span>
					<span>الثلاثاء</span>
					<span>الأربعاء</span>
					<span>الخميس</span>
					<span>الجمعة</span>
					<span>السبت</span>
				`;
				// Calculate grid bounds
				const firstOfMonth = new Date(year, month, 1),
				startDay = new Date(year, month, 1 - firstOfMonth.getDay()),
				lastOfMonth = new Date(year, 1 + month, 0),
				totalGridDays = Math.ceil((firstOfMonth.getDay() + lastOfMonth.getDate()) / 7) * 7;
				// Generate rows
				const curr = new Date(startDay);
				for (let i = 0; i < totalGridDays; i++) {
					// Prepend week number at the start of each row (every 7 days)
					if (i % 7 === 0) html += `<span class="week-number">${getWeekNumber(curr)}</span>`;
					// Add day span (adds 'other-month' class for previous/next month dates)
					html += `<span class="${curr.getMonth() !== month ? 'other-month' : ''}">${curr.getDate()}</span>`;
					curr.setDate(1 + curr.getDate());
				}
				container.innerHTML = html;
			};

					<path d="M9 16l2 2 4-4" stroke-width="2.5" />

				for (const key in templates) {

				}
			}
			makeTemplates(menu);
			makeTemplates(view);
			addEventListener('load', () => {
				const body = document.body,
				header = body.firstElementChild,
				main = body.children[1],
				footer = body.lastElementChild;
				actions.set(footer.firstElementChild, () => {
					header.replaceChildren(menu.calendar.content.cloneNode(1));
					main.replaceChildren(view.calendar.content.cloneNode(1));
					renderCalendar();
				});
				actions.set(footer.children[1], () => {

					main.replaceChildren(view.event.content.cloneNode(1));
				});
				header.replaceChildren(menu.calendar.content.cloneNode(1));
				main.replaceChildren(view.calendar.content.cloneNode(1));
				renderCalendar();
				addEventListener('pointerup', event => {
					const button = event.target.closest('button');
					button && actions.get(button)?.(button, event);
				});
			});
